[build-system]
requires = [
    "setuptools >= 61, < 82",
    "setuptools_scm[toml] >= 6.2",
    "wheel",
    # NumPy 2.x at build time -> the resulting wheel is ABI-compatible with
    # both NumPy 1.x (>=1.22) and 2.x at runtime. Required because the
    # checked-in _cadsd.c uses the NumPy 2.x PyArray_Descr layout.
    "numpy >= 2.0",
    # 3.1+ is needed for the NumPy 2.x compatibility shims in numpy.pxd.
    "Cython >= 3.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "didgelab"
dynamic = ["version"]
authors = [
  { name = "Jan Nehring", email = "jan.nehring@outlook.com" },
]
description = "Acoustical simulation and computer-aided design of didgeridoos"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "CC BY-NC-SA 4.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "configargparse>=1.5.3",
    "pandas>=2.1.0,<3",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "prettytable>=3.4.1",
    "seaborn>=0.12.0",
    "tqdm>=4.67.3",
    "cython>=3.1",
    "jsonlines>=4.0.0",
    "pytest>=9.0.3",
    "scikit-fem>=10.0.2",
    "build>=1.4.0",
    "twine>=6.2.0",
    "setuptools>=82",
]

[project.urls]
Homepage = "https://github.com/didgitaldoo/didge-lab"
Issues = "https://github.com/didgitaldoo/didge-lab/issues"

[tool.setuptools_scm]
write_to = "src/didgelab/_version.py"
local_scheme = "no-local-version"
version_scheme = "post-release"

[tool.setuptools.packages.find]
where = ["src"]
